services:
  - type: web
    name: inventory-manager-api
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: DB_PATH
        value: /data/inventory.db
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: API_KEY
        sync: false
    disk:
      name: inventory-data
      mountPath: /data
      sizeGB: 1
