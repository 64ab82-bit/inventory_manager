services:
  - type: web
    name: inventory-manager-api
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8080
      - key: MSSQL_HOST
        sync: false
      - key: MSSQL_PORT
        value: 1433
      - key: MSSQL_DATABASE
        sync: false
      - key: MSSQL_USER
        sync: false
      - key: MSSQL_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: API_KEY
        sync: false
